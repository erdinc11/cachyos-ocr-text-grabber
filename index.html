<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grab2Text</title><link rel="stylesheet" href="style.css"></head>
<body><main id="settings" hidden><h1>Settings</h1><p>Keyboard shortcut for grabbing text from the screen</p><button id="shortcut" type="button">⌘ + Left Shift + 1</button><small id="hint">Click to change, then press a new shortcut.</small><p class="note">Shortcut: <span id="current"></span></p></main>
<div id="overlay" hidden><div id="selection"></div><div class="overlay-tip">Drag to select text · Esc to cancel</div></div>
<div id="toast" hidden></div><script src="renderer.js"></script></body></html>
