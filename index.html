<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grab2Text</title><link rel="stylesheet" href="style.css"></head>
<body><main id="settings" hidden><h1>Ayarlar</h1><p>Ekrandaki metni yakalamak için kullanılacak kısayol</p><button id="shortcut" type="button">⌘ + Sol Shift + 1</button><small id="hint">Değiştirmek için tıklayın, yeni kısayola basın.</small><p class="note">Kısayol: <span id="current"></span></p></main>
